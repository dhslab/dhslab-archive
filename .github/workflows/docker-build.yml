name: Build and publish Docker image

# Runs on every push to main that touches the Dockerfile or the script, on manual
# trigger, and on a nightly schedule (optional - remove the "schedule" block if you
# only want builds triggered by pushes/manual runs).
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "dhslab_archive.py"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 6 * * *"   # 06:00 UTC daily

# Least-privilege token permissions: read the repo, write packages (to push to ghcr.io)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ghcr.io requires the image path to be lowercase; github.repository can contain
      # uppercase letters (e.g. an org/user name), so normalize it here.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Date tag in YYMMDD, based on UTC so it's stable regardless of runner timezone.
      - name: Compute date tag
        id: date
        run: echo "tag=$(date -u +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pulled tags
        run: |
          echo "Pushed:"
          echo "  ${{ steps.image.outputs.name }}:latest"
          echo "  ${{ steps.image.outputs.name }}:${{ steps.date.outputs.tag }}"